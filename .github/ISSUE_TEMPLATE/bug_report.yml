name: Bug report
description: Something shows the wrong value, looks broken, or does not install.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please do not paste API keys, session logs or anything private.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output of `bash ~/.claude/statusline.sh --selftest`
      render: text
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows (Git Bash), Other]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `bash --version | head -1; jq --version; claude --version`
